<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тесты по неврологии</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f3f6fb;
      --card: #fff;
      --text: #172033;
      --muted: #667085;
      --primary: #3157c8;
      --primary-hover: #2445aa;
      --border: #d9e0ec;
      --success: #16794b;
      --success-bg: #e8f6ef;
      --error: #bb2e37;
      --error-bg: #fff0f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }
    .container { width: min(100%, 760px); margin: 0 auto; }
    header { margin-bottom: 24px; text-align: center; }
    header h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 5vw, 2.4rem); }
    header p { margin: 0; color: var(--muted); }
    .card {
      padding: clamp(20px, 5vw, 36px);
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 10px 30px rgb(31 48 84 / 7%);
    }
    .primary-button, .secondary-button {
      min-height: 46px;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }
    .primary-button { background: var(--primary); color: white; }
    .primary-button:hover:not(:disabled) { background: var(--primary-hover); }
    .secondary-button { border: 1px solid var(--border); background: white; color: var(--text); }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .quiz-top { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 14px; color: var(--muted); font-size: .95rem; }
    .progress-track { height: 8px; overflow: hidden; margin-bottom: 26px; border-radius: 99px; background: #e9edf5; }
    .progress-bar { width: 0; height: 100%; border-radius: inherit; background: var(--primary); transition: width .2s ease; }
    .question { margin: 0 0 22px; font-size: clamp(1.2rem, 4vw, 1.55rem); line-height: 1.35; }
    .answers { display: grid; gap: 12px; }
    .answer-button {
      width: 100%; padding: 14px 16px; border: 1px solid var(--border);
      border-radius: 10px; background: white; color: var(--text); text-align: left;
      cursor: pointer; font: inherit; transition: border-color .15s, background .15s;
    }
    .answer-button:hover:not(:disabled) { border-color: var(--primary); background: #f7f9ff; }
    .answer-button.correct { border-color: var(--success); background: var(--success-bg); }
    .answer-button.incorrect { border-color: var(--error); background: var(--error-bg); }
    .feedback { min-height: 28px; margin: 16px 0; font-weight: 700; }
    .feedback.correct-text { color: var(--success); }
    .feedback.incorrect-text { color: var(--error); }
    .quiz-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .result { text-align: center; }
    .result h2 { margin-top: 0; }
    .score { margin: 16px 0; color: var(--primary); font-size: 2rem; font-weight: 800; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) {
      body { padding: 20px 12px; }
      .quiz-top { font-size: .85rem; }
      .quiz-controls > button { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Тесты по неврологии</h1>
      <p>Проверь свои знания</p>
    </header>

    <section class="card" id="start-screen" style="text-align:center">
      <button id="start-button" class="primary-button">Начать тест</button>
    </section>

    <section class="card" id="quiz-screen" hidden>
      <div class="quiz-top">
        <span id="question-counter"></span>
        <span id="score-counter"></span>
        <span>Время: <strong id="timer">00:00</strong></span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Прогресс теста" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <h2 class="question" id="question-text"></h2>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <div class="quiz-controls">
        <button id="next-button" class="primary-button" disabled>Следующий вопрос</button>
        <button id="restart-during-quiz" class="secondary-button">Пройти заново</button>
        <button id="exit-quiz" class="secondary-button">Выйти из теста</button>
      </div>
    </section>

    <section class="card result" id="result-screen" hidden>
      <h2>Тест завершён</h2>
      <p>Ваш результат:</p>
      <p class="score" id="final-score"></p>
      <p id="result-message"></p>
      <p>Время прохождения: <strong id="final-time"></strong></p>
      <div class="quiz-controls" style="justify-content:center">
        <button id="restart-button" class="primary-button">Пройти ещё раз</button>
      </div>
    </section>
  </main>

  <script>
    // Все вопросы находятся в самом сайте — посетителю не нужно ничего загружать.
    // Чтобы добавить вопросы, добавьте новые объекты в этот массив.
    const questionBank = [
      {
        text: "Какое сочетание признаков наиболее характерно для синдрома Горнера?",
        answers: [
          { text: "Мидриаз, птоз, слезотечение", correct: false },
          { text: "Миоз, птоз, энофтальм", correct: true },
          { text: "Миоз, птоз, двоение", correct: false },
          { text: "Мидриаз, экзофтальм, гипергидроз", correct: false }
        ]
      },
      {
        text: "Повреждение какой системы приводит к развитию синдрома Горнера?",
        answers: [
          { text: "Парасимпатической иннервации", correct: false },
          { text: "Соматической иннервации", correct: false },
          { text: "Симпатической иннервации", correct: true },
          { text: "Чувствительных волокон тройничного нерва", correct: false }
        ]
      },
      {
        text: "На какой стороне обычно проявляются признаки синдрома Горнера?",
        answers: [
          { text: "На противоположной стороне от поражения", correct: false },
          { text: "На той же стороне, что и поражение симпатического пути", correct: true },
          { text: "С обеих сторон в равной степени", correct: false },
          { text: "Сторона проявлений зависит только от возраста пациента", correct: false }
        ]
      },
      {
        text: "Длительность неврологических расстройств при транзиторной ишемической атаке обычно не превышает:",
        answers: [
          { text: "24 часов", correct: true },
          { text: "48 часов", correct: false },
          { text: "7 дней", correct: false },
          { text: "30 дней", correct: false }
        ]
      }
    ];

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionCounter = document.getElementById("question-counter");
    const scoreCounter = document.getElementById("score-counter");
    const progressBar = document.getElementById("progress-bar");
    const progressTrack = document.querySelector(".progress-track");
    const questionText = document.getElementById("question-text");
    const answersContainer = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("next-button");

    let questions = [];
    let questionIndex = 0;
    let score = 0;
    let answered = false;
    let startTime = 0;
    let timerInterval = null;

    function formatTime(totalSeconds) {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const mmss = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      return hours > 0 ? `${String(hours).padStart(2, "0")}:${mmss}` : mmss;
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      document.getElementById("timer").textContent = formatTime(elapsed);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    // Перемешивание Фишера — Йетса.
    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function startQuiz() {
      questions = shuffle(questionBank).map(question => ({
        text: question.text,
        answers: shuffle(question.answers)
      }));
      questionIndex = 0;
      score = 0;
      startScreen.hidden = true;
      resultScreen.hidden = true;
      quizScreen.hidden = false;
      startTime = Date.now();
      document.getElementById("timer").textContent = "00:00";
      stopTimer();
      timerInterval = setInterval(updateTimer, 1000);
      showQuestion();
    }

    function showQuestion() {
      const question = questions[questionIndex];
      answered = false;
      questionCounter.textContent = `Вопрос ${questionIndex + 1} из ${questions.length}`;
      scoreCounter.textContent = `Правильных ответов: ${score}`;
      const progress = (questionIndex / questions.length) * 100;
      progressBar.style.width = `${progress}%`;
      progressTrack.setAttribute("aria-valuenow", String(Math.round(progress)));
      questionText.textContent = question.text;
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.disabled = true;
      nextButton.textContent = questionIndex === questions.length - 1 ? "Завершить тест" : "Следующий вопрос";
      answersContainer.replaceChildren();

      question.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer-button";
        button.textContent = `${String.fromCharCode(65 + index)}. ${answer.text}`;
        button.addEventListener("click", () => chooseAnswer(button, answer));
        answersContainer.appendChild(button);
      });
    }

    function chooseAnswer(selectedButton, selectedAnswer) {
      if (answered) return;
      answered = true;
      const buttons = answersContainer.querySelectorAll(".answer-button");
      buttons.forEach((button, index) => {
        button.disabled = true;
        if (questions[questionIndex].answers[index].correct) button.classList.add("correct");
      });

      if (selectedAnswer.correct) {
        score++;
        feedback.textContent = "Верно!";
        feedback.classList.add("correct-text");
      } else {
        selectedButton.classList.add("incorrect");
        feedback.textContent = "Неверно. Правильный ответ отмечен зелёным.";
        feedback.classList.add("incorrect-text");
      }
      scoreCounter.textContent = `Правильных ответов: ${score}`;
      nextButton.disabled = false;
    }

    nextButton.addEventListener("click", () => {
      if (!answered) return;
      questionIndex++;
      if (questionIndex < questions.length) showQuestion();
      else showResult();
    });

    function showResult() {
      updateTimer();
      stopTimer();
      quizScreen.hidden = true;
      resultScreen.hidden = false;
      const percentage = Math.round((score / questions.length) * 100);
      document.getElementById("final-score").textContent = `${score} из ${questions.length} — ${percentage}%`;
      document.getElementById("final-time").textContent = document.getElementById("timer").textContent;
      let message = "Хорошая работа!";
      if (percentage === 100) message = "Отличный результат — все ответы правильные!";
      else if (percentage < 50) message = "Можно повторить материал и пройти тест ещё раз.";
      document.getElementById("result-message").textContent = message;
    }

    document.getElementById("start-button").addEventListener("click", startQuiz);
    document.getElementById("restart-button").addEventListener("click", startQuiz);

    document.getElementById("restart-during-quiz").addEventListener("click", () => {
      if (window.confirm("Начать тест заново? Текущий результат будет сброшен.")) {
        startQuiz();
      }
    });

    document.getElementById("exit-quiz").addEventListener("click", () => {
      if (window.confirm("Выйти из теста? Текущий прогресс и результат не сохранятся.")) {
        stopTimer();
        quizScreen.hidden = true;
        resultScreen.hidden = true;
        startScreen.hidden = false;
      }
    });
  </script>
</body>
</html>
